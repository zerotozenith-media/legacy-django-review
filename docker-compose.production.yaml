version: "3.9"

services:
  app:
    container_name: app
    image: adminappcontreg.azurecr.io/dclmca:1.3.2
    command:
      - /bin/bash
      - -c
      - |
        python manage.py wait_for_db 
        python manage.py migrate
        python manage.py collectstatic --no-input
        gunicorn core.wsgi:application --bind 0.0.0.0:80 --workers 2 --threads 4
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      SECRET_KEY: ${SECRET_KEY}
      CELERY_BROKER: ${CELERY_BROKER}
      CELERY_BACKEND: ${CELERY_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      NATIONAL_OVERSEA_EMAIL: ${NATIONAL_OVERSEA_EMAIL}
    networks:
      - backend
    depends_on:
      - redis

  redis:
    image: redis:7.4.1
    restart: unless-stopped
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend

  celery:
    image: adminappcontreg.azurecr.io/worker:1.3.0
    container_name: celery
    restart: always
    build:
      context: .
    command: celery --app=core worker -l INFO -Q celery,celery:1,celery:2,celery:3
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DEBUG: ${DEBUG}
      CELERY_BROKER: ${CELERY_BROKER}
      CELERY_BACKEND: ${CELERY_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      NATIONAL_OVERSEA_EMAIL: ${NATIONAL_OVERSEA_EMAIL}
    depends_on:
      - app
      - redis
    networks:
      - backend

  celery-beat:
    image: adminappcontreg.azurecr.io/beat:1.3.0
    container_name: celery_beat
    restart: always
    build:
      context: .
    command: celery --app=core beat --loglevel=info
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DEBUG: ${DEBUG}
      CELERY_BROKER: ${CELERY_BROKER}
      CELERY_BACKEND: ${CELERY_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      NATIONAL_OVERSEA_EMAIL: ${NATIONAL_OVERSEA_EMAIL}
    depends_on:
      - redis
      - app
    networks:
      - backend

networks:
  backend:
    driver: bridge
