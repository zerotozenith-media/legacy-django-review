{% extends 'layouts/base.html' %}
{% load static %}

{% block breadcrumbs %}{% endblock breadcrumbs %}

{% block content %}
    {% include 'income/components/source--modal.html' %}
    <div class="row">
        <div class="col-sm-12">
            <div class="card">
                <div class="card-header">
                    <h5> Region Income</h5>
                </div>
                <div class="card-body">
                    <h5>Edit Region Income</h5>
                    <hr>
                    <form action="{% url 'region-income-edit' values.id %}" method="post">
                        {% include 'partials/_messages.html' %}
                        {% csrf_token %}
                        <div class="form-row">
                            <div class="form-group col-md-6" style="margin-top: 0.75rem">
                                <label for="region">Select Region</label>
                                <select name="region" id="region" class="form-control" required>
                                    <option value="">All Regions</option>
                                    {% for region in regions %}
                                    <option value="{{ region.id }}" {% if region.id == values.region.id %}selected{% endif %}>
                                        {{ region.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-6">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <label for="exampleFormControlSelect1">Sources</label>
                                        <button type="button" id="addSourceButton" class="btn mr-0 "><span><i
                                                class="fa fa-plus"></i> Add Source</span></button>
                                    </div>
                                    <select class="form-control" name="source" required>
                                        <option value="">Select a source</option>
                                        {% for source in sources %}
                                            <option name="source" data-user_id="{{ source.entry_by_id }}"
                                                    value="{{ source.id }}" {% if source.id == values.source_id %}selected{% endif %}>
                                                {{ source.name }}
                                            </option>
                                        {% endfor %}
                                    </select>
                            </div>
                            <div class="form-group col-md-6 d-none">
                                <label for="account">Account Number</label>
                                <select class="form-control" name="account">
                                    {% for account in accounts %}
                                        <option name="account"
                                                value="{{ account.id }}">{{ account.account_number }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6" style="padding-top: 10px">
                                <label for="">Date of Income</label>
                                <input type="date" class="form-control" name="income_date"  value="{{values.date|date:'Y-m-d' }}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="">Amount</label>
                                <input type="number" class="form-control"  value="{{values.amount|floatformat:2 }}" name="amount" placeholder="Amount" min="0" required step="0.01">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                              <label for="description">Description</label>
                              <textarea class="form-control" name="description" id="description" rows="3">{{ values.description }}</textarea>
                          </div>

                        </div>

                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
