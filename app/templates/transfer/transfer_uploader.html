{% extends 'layouts/base.html' %}
{% block breadcrumbs %}{% endblock breadcrumbs %}
{% load static %}
{% block content %}
    <div>
        {% include 'partials/_messages.html' %}
        <div class="container mt-5">
            {% if errors %}
                <div class="alert alert-danger" role="alert">
                    {{ errors.error }}
                </div>
            {% endif %}

            <div class="text-center">
                <h2 class="mb-4">Transfer Uploader</h2>
                <form method="post" enctype="multipart/form-data" action="{% url 'transfer_uploader' %}">
                    {% csrf_token %}

                    <!-- Row 1: local_church Selection -->
                    <div class="row justify-content-center mb-3 mt-5">
                        <div class="col-md-4">
                            <label for="region_id" class="form-label">Region</label>
                            <select name="region_id" id="region_id" class="form-control">
                                <option value="">Select Region</option>
                                {% for region in all_regions %}
                                    <option value="{{ region.id }}"
                                            {% if region_id == region.id %}selected{% endif %}>{{ region.name|lower }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Row 2: File Input -->
                    <div class="row justify-content-center mb-3 mt-5">
                        <div class="col-md-4">
                            <input type="file" id="userFileInput" name="file" class="form-control-file" accept=".xlsx" required>
                        </div>
                    </div>

                    <!-- Row 3: Submit Button and Download Button -->
                    <div class="row justify-content-center mr-5 mt-5">
                        <div class="col-md-12">
                            <div id="selectedFileName" class="mt-3"></div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-success btn-lg rounded">Upload Transfer Data</button>
                                <a href="{% url 'download_transfer_uploader_sample' %}" class="btn btn-primary btn-lg rounded">Download Sample XLSX</a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
