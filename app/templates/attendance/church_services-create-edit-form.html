<div class="row">
    {#    <div class="form-row">#}
    <div class="form-group col-md-6">
        <label for="local_church">Church</label>
        <select class="form-control" name="local_church" required>
            <option value="">Select Church</option>
            {% for local_church in local_churches %}
                <option name="local_church" value="{{ local_church.id }}"
                        {% if local_church in request.user.pastor_churches.all %}selected{% endif %}>{{ local_church.local_church_name.title }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group col-md-6">
        <label for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Name" required>
    </div>
</div>
<div class="row">
    {#    <div class="form-row">#}
    <div class="form-group col-md-6">
        <label for="short_name">Short Name</label>
        <input type="text" class="form-control" id="short_name" name="short_name" placeholder="Short Name">
    </div>
    <div class="form-group col-md-6">
        <label for="description">Description</label>
        <input type="text" class="form-control" id="description" name="description" placeholder="Description">
    </div>
    {#    </div>#}
</div>
<button type="submit" class="btn btn-primary">Submit</button>
