{% extends 'layouts/base.html' %}
{% load static %}

{% block breadcrumbs %}{% endblock breadcrumbs %}

{% block content %}
    <div class="row">
        <div class="col-sm-12">
            <div class="card">
                <div class="card-header">
                    <h5>Edit Church Property</h5>
                </div>
                <div class="card-body">
                    <hr>
                    <form action="{% url 'edit-property' church_property.id %}" method="post">
                        {% include 'partials/_messages.html' %}
                        {% csrf_token %}
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="local_church">Church</label>
                                <select class="form-control" name="local_church" required {% if request.user.role == 2 %} disabled {% endif %}>
                                    <option value="">Select Church</option>
                                    {% for local_church in local_churches %}
                                        <option name="local_church" value="{{ local_church.id }}"
                                                {% if local_church.id == church_property.local_church.id %}selected{% endif %}>
                                            {{ local_church.local_church_name.title }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="name">Name</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Name"
                                       value="{{ church_property.name }}" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="purchase_date">Purchase Date</label>
                                <input type="date" class="form-control" id="purchase_date" name="purchase_date"
                                       value="{{ church_property.purchase_date|date:'Y-m-d' }}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="serial_no">Serial No</label>
                                <input type="text" class="form-control" id="serial_no" name="serial_no"
                                       placeholder="Serial No" value="{{ church_property.serial_no }}">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="amount_paid">Amount Paid (Inc. Tax)</label>
                                <input type="number" class="form-control" id="amount_paid" name="amount_paid" min="0"
                                       placeholder="Amount Paid" value="{{ church_property.amount_paid }}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="mode_of_disposal">Mode of Disposal</label>
                                <input type="text" class="form-control" id="mode_of_disposal" name="mode_of_disposal"
                                       placeholder="Mode of Disposal" value="{{ church_property.mode_of_disposal }}">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="amount_sold">Amount Sold</label>
                                <input type="number" class="form-control" id="amount_sold" name="amount_sold" min="0"
                                       placeholder="Amount Sold" value="{{ church_property.amount_sold }}">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="disposal_date">Disposal Date</label>
                                <input type="date" class="form-control" id="disposal_date" name="disposal_date"
                                       placeholder="Disposal Date" value="{{ church_property.disposal_date|date:'Y-m-d' }}">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="description">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3"
                                          placeholder="Description">{{ church_property.description }}</textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Update</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
